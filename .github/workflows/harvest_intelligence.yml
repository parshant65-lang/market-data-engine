name: Harvest Financial Intelligence

on:
  schedule:
    # Backup heartbeat trigger every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: market-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Engine Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Continuous Market Intelligence Engine
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: python collector.py
